name: NH asset safety verification (no orders)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'nh_client.py'
      - 'run_cloud.py'
      - 'tests/**'
      - '.github/workflows/nh-asset-safety.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q nh_client.py run_cloud.py
      - run: python -m unittest discover -s tests -v
