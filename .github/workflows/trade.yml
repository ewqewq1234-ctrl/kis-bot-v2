name: ETF Grid Trading Bot

on:
  schedule:
    # 1. 정규장 매 정각 감시 (KST 09:00 ~ 15:00 -> UTC 00:00 ~ 06:00)
    - cron: '0 0-6 * * 1-5'
    # 2. 장 마감 일일 결산 브리핑 실행 (KST 15:35 -> UTC 06:35)
    - cron: '35 6 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 봇 1회 체크 및 매매 실행
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_cloud.py

      - name: 변경된 상태 파일(state/tokens) 깃허브 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json tokens.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update state
