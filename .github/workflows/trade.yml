name: ETF Grid Trading Bot (Strategy B)

on:
  schedule:
    # Explicit UTC slots = KST Monday-Friday 07:12 through 17:12.
    - cron: '12 22 * * 0-4'  # KST 07:12
    - cron: '12 23 * * 0-4'  # KST 08:12
    - cron: '12 0 * * 1-5'  # KST 09:12
    - cron: '12 1 * * 1-5'  # KST 10:12
    - cron: '12 2 * * 1-5'  # KST 11:12
    - cron: '12 3 * * 1-5'  # KST 12:12
    - cron: '12 4 * * 1-5'  # KST 13:12
    - cron: '12 5 * * 1-5'  # KST 14:12
    - cron: '12 6 * * 1-5'  # KST 15:12
    - cron: '12 7 * * 1-5'  # KST 16:12
    - cron: '12 8 * * 1-5'  # KST 17:12
  workflow_dispatch:

# 일정·수동 실행 중첩으로 이중 주문하지 않도록 직렬화
concurrency:
  group: nh-strategy-b-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exit immediately outside weekday market/report hours
        id: runtime
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "cron=$SCHEDULE"
          python3 - <<'PYGATE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          active = now.weekday() < 5 and 9 <= now.hour < 17
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          print(f"Actual KST time: {now.isoformat()}; active={active}")
          PYGATE

      - name: 저장소 체크아웃
        if: steps.runtime.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 파이썬 3.11 환경 설정
        if: steps.runtime.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        if: steps.runtime.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: 정적/단위 테스트
        if: steps.runtime.outputs.active == 'true'
        run: |
          python -m compileall -q run_cloud.py nh_client.py
          python -m unittest discover -s tests -v

      - name: 전략 B 실행 (기본은 주문 비활성)
        if: steps.runtime.outputs.active == 'true'
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_LIVE_ORDERS: ${{ vars.ENABLE_LIVE_ORDERS || 'NO' }}
          RUN_MIDDAY_REPORT: 'N'
          HOURLY_OPERATION: 'Y'
        run: python run_cloud.py

      # 전략이 안전중단/오류를 일으켜도 pending 상태를 보존해 재주문 차단
      - name: 상태파일 변경 커밋
        if: always() && steps.runtime.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f state.json ]]; then
            echo 'state.json 없음 — 상태 영속화 실패'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if [[ -f nh_api_health.json ]]; then
            git add nh_api_health.json
          fi
          if ! git diff --cached --quiet -- state.json nh_api_health.json; then
            git commit -m 'Auto: Update state.json [skip ci]'
            git push origin HEAD
          else
            echo '상태파일 변경사항 없음'

            echo '상태파일 변경사항 없음'
          fi

